<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c152a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <filter id="dotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <!-- DV Monogram -->
  <text x="10" y="43" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="-1">DV</text>
  <!-- Accent cyan dot matching topbar -->
  <circle cx="51" cy="41" r="3.5" fill="#38bdf8" filter="url(#dotGlow)"/>
</svg>
